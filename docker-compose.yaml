services:
  anypod:
    image: ghcr.io/thurstonsand/anypod:latest # or 'nightly' to track main
    container_name: anypod
    init: true
    restart: unless-stopped

    ports:
      - "8024:8024" # Public RSS & media server
      - "127.0.0.1:8025:8025" # Admin API (localhost-only; never expose publicly)

    volumes:
      # Copy example_feeds.yaml to feeds.yaml and customize before starting
      - ./feeds.yaml:/config/feeds.yaml:ro

      # Persistent database, downloaded media, thumbnails, and transcripts
      - ./data:/data

      # Optional: cookies.txt for authenticated feeds (create the file before starting)
      # - ./cookies.txt:/cookies/cookies.txt:ro

      # System timezone (or set TZ below)
      - /etc/localtime:/etc/localtime:ro

    environment:
      # Container user/group (run `id -u` and `id -g` on your host)
      PUID: 1000
      PGID: 1000

      # Public URL used inside generated RSS feeds (required for phone podcast apps)
      # BASE_URL: https://podcasts.example.com

      # Reverse proxy trusted IPs/CIDRs (JSON array or comma-separated string)
      # TRUSTED_PROXIES: '["192.168.1.0/24"]'

      # Optional: enable cookies for authenticated sources (e.g. Patreon)
      # COOKIES_PATH: /cookies/cookies.txt

      # Logging
      # LOG_FORMAT: human                  # human | json
      # LOG_LEVEL: INFO                    # DEBUG | INFO | WARNING | ERROR
      # LOG_INCLUDE_STACKTRACE: "false"    # true to include stack traces

      # Timezone for cron schedules and date parsing (optional)
      # TZ: "America/New_York"

      # yt-dlp self-update behavior
      # YT_CHANNEL: stable                 # stable | nightly | master | disabled
      # YT_DLP_UPDATE_FREQ: 12h            # e.g., 6h, 12h, 1d, or 0 to disable

      # Optional: YouTube PO Token provider (recommended for YouTube reliability)
      POT_PROVIDER_URL: http://bgutil-provider:4416

    depends_on:
      bgutil-provider:
        condition: service_healthy

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4416/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
