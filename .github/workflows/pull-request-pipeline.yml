name: Pull Request Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  security-scans:
    name: Security Scans
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: ./.github/workflows/security-scans.yml
