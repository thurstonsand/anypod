# Copy this file to feeds.yaml and customize your feeds.
# Full reference: docs/configuration.md

feeds:
  # YouTube channel (defaults to the channel's Videos tab)
  example_channel:
    url: https://www.youtube.com/@example
    schedule: "@daily" # Cron expression or @hourly, @daily, @weekly, @monthly
    keep_last: 10 # Keep the 10 most recent episodes
    since: "2025-01-01" # Optional cutoff date (YYYY-MM-DD or YYYYMMDD)
    transcript_lang: en # Optional: fetch English captions as <podcast:transcript>

  # YouTube playlist with custom podcast metadata
  example_playlist:
    url: https://www.youtube.com/playlist?list=PLexamplePlaylistId
    schedule: "0 6 * * *"
    keep_last: 5
    metadata:
      title: "My Curated Playlist"
      description: "Selected videos delivered straight to my podcast app"
      language: "en"
      category:
        - "Technology"
      podcast_type: "episodic"
      explicit: "no"

  # Manual feed: submit individual URLs on demand via POST /admin/feeds/manual_drops/downloads
  manual_drops:
    schedule: "manual"
    metadata:
      title: "Manual Drops"
      description: "Ad-hoc videos submitted via the admin API"
