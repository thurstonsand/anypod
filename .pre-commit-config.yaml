repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.7
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]

      - id: basedpyright
        name: basedpyright type checking
        entry: uv run basedpyright
        language: system
        types: [python]

      - id: alembic-migration-check
        name: check for schema drift
        entry: ./scripts/check_migrations.sh
        language: system
        pass_filenames: false
        files: '^(src/anypod/db/types/.*\.py|alembic/(versions/.*\.py|env\.py))$'
